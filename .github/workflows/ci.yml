name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    # A real Paseo daemon with the scripted harness: the plugin loads, attaches with no client
    # open, its setup check passes on a good daemon and names what's missing on a broken one, and loop 2
    # runs two tasks end to end.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: zsh (Paseo reports script exit codes only under zsh)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: quiet zsh startup (compinit's insecure-directories prompt eats the first command Paseo types)
        run: |
          echo 'skip_global_compinit=1' >> ~/.zshenv
          zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null | xargs -r sudo chmod g-w,o-w
      - run: npm ci
        working-directory: plugin
      - run: npm ci
        working-directory: e2e
      - run: npm ci
        working-directory: e2e/scripted-harness
      - run: git config --global user.email ci@localhost && git config --global user.name CI
      - run: bash e2e/smoke.sh
      - name: loop 2 (two tasks through build, checks, a fix round, review, a late answer and accept; the PM chat and a declined card)
        run: bash e2e/loop2.sh
      - name: loop 1 into loop 2 (idea, Clarify, spec, plan and task list approved, tasks run and accepted)
        run: bash e2e/loop1.sh
      - name: Quick flow (spec, plan and task list in one turn, approved once)
        run: bash e2e/quick.sh
      - name: Ship by GitHub PR (a fake gh and a bare remote; PR opened, new commits re-verify, merged moves to Done)
        run: bash e2e/ship-pr.sh
      - name: Slices exit test (three slices as stacked PRs, promoted and retargeted in order, a spec change mid-way)
        run: bash e2e/slices.sh
      - name: M1 exit test (extended Shout scenario with a spec edit during Build, Verify and Ship)
        run: bash e2e/exit.sh
      - name: updating Foundry keeps its data (install-local.sh run twice over a project and feature)
        run: bash e2e/reinstall.sh
      - name: Uninstall keeps data unless purged, and purges only Foundry's own
        run: bash e2e/uninstall.sh
      - name: Playwright with Chromium, for the screens test
        working-directory: e2e
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: screens (the Shout scenario clicked through Foundry's screens in Paseo's web app)
        run: bash e2e/ui.sh
      - name: screenshots from the screens test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-screens
          path: /tmp/foundry-e2e/ui
          if-no-files-found: ignore
      - name: scripted harness log on failure
        if: failure()
        run: tail -100 "${TMPDIR:-/tmp}/foundry-e2e/scripted.log" || true
      - name: daemon log on failure
        if: failure()
        run: tail -200 "${TMPDIR:-/tmp}/foundry-e2e/paseo-home/daemon.log" || true
